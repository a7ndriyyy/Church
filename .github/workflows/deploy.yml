name: Deploy React app to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: church-website
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: church-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # The site is served from https://a7ndriyyy.github.io/Church/
          PUBLIC_URL: /Church
          # Set these in GitHub: Settings → Secrets and variables → Actions
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
          REACT_APP_STRIPE_DONATION_LINK: ${{ secrets.REACT_APP_STRIPE_DONATION_LINK }}

      # GitHub Pages serves 404.html for unknown paths, so /Church/admin etc. load the app
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./church-website/build
